name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed for the compatibility check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build dist/ from the registry
        run: npm run build

      - name: dist/ must be committed and up to date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

      - name: Tests
        run: npm test

      - name: Budget check (locked budgets, no override)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tools/check-budget.mjs --base "origin/${{ github.base_ref }}"
          else
            node tools/check-budget.mjs
          fi

      - name: Compatibility and version check
        run: npm run check:compat
