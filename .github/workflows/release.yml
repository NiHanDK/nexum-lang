name: Release

# Every version that reaches main is tagged and released. Tags are never deleted:
# setups download agent cards and tools from these releases (nx sync).
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify before releasing
        run: |
          npm run build
          git diff --quiet -- dist || { echo "::error::dist/ is out of date"; exit 1; }
          npm test

      - name: Tag and release a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./dist/registry.json').version")
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V is already released; nothing to do."
            exit 0
          fi
          mkdir -p release
          cp dist/nx.mjs dist/translator.html dist/registry.json dist/SPEC.md release/
          for f in dist/cards/*.md; do cp "$f" "release/card-$(basename "$f")"; done
          gh release create "v$V" release/* \
            --target "$GITHUB_SHA" \
            --title "NEXUM $V" \
            --notes "NEXUM $V. Agent cards: card-<pack>.md. Translator: translator.html. CLI: nx.mjs. Full specification: SPEC.md. Install in a setup with: node nx.mjs sync --version ${V%.*} --packs core,..."
